    <script>
      // Resolve the stored theme before the first paint.
      try {
        const theme = localStorage.getItem("pb-theme");
        document.documentElement.dataset.theme =
          theme === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
